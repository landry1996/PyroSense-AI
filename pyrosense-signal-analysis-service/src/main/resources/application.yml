spring:
  application:
    name: pyrosense-signal-analysis-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pyrosense_analysis
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: signal-analysis-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

pyrosense:
  analysis:
    kafka:
      topic: telemetry-events
      output-topic: analysis-events
    thresholds:
      z-score-threshold: 3.0
      thd-max-percent: 8.0
      temperature-max-celsius: 85.0
      temperature-rise-rate-per-hour: 5.0
      micro-arc-recurrence-threshold: 3
      transient-count-threshold: 10
      hf-noise-max-db: -40.0
      power-factor-min: 0.85
      drift-percent-threshold: 15.0
      exponential-smoothing-alpha: 0.3
      baseline-minimum-samples: 100
