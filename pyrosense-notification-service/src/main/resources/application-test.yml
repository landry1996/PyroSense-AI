spring:
  datasource:
    url: jdbc:h2:mem:notification_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
          jwk-set-uri: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs

pyrosense:
  notification:
    retry:
      interval-ms: 60000
    deduplication:
      window-minutes: 30
