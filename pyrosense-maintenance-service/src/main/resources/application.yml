spring:
  application:
    name: pyrosense-maintenance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pyrosense_maintenance
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: maintenance-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/pyrosense}
          jwk-set-uri: ${KEYCLOAK_JWK_SET:http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs}

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

pyrosense:
  maintenance:
    kafka:
      alerting-topic: alerting-events
      output-topic: maintenance-events
