spring:
  datasource:
    url: jdbc:h2:mem:maintenance_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/test
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
          jwk-set-uri: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs
