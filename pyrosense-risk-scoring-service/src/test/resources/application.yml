spring:
  datasource:
    url: jdbc:h2:mem:scoring_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/test
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scoring-test
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
          jwk-set-uri: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs

pyrosense:
  scoring:
    kafka:
      topic: analysis-events
      output-topic: scoring-events
    weights:
      micro-arc-weight: 0.30
      thd-drift-weight: 0.20
      temperature-trend-weight: 0.20
      transient-weight: 0.10
      hf-noise-weight: 0.10
      recency-decay-factor: 0.95
      repetition-boost-factor: 1.3
      device-reliability-weight: 0.10
      history-window-days: 7
      recency-window-hours: 24
