spring:
  application:
    name: pyrosense-risk-scoring-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5432/pyrosense_scoring
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: risk-scoring-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/pyrosense}
          jwk-set-uri: ${KEYCLOAK_JWK_SET:http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs}

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

pyrosense:
  scoring:
    kafka:
      topic: analysis-events
      output-topic: scoring-events
    weights:
      micro-arc-weight: 0.30
      thd-drift-weight: 0.20
      temperature-trend-weight: 0.20
      transient-weight: 0.10
      hf-noise-weight: 0.10
      recency-decay-factor: 0.95
      repetition-boost-factor: 1.3
      device-reliability-weight: 0.10
      history-window-days: 7
      recency-window-hours: 24
