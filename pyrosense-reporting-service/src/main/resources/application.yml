spring:
  application:
    name: pyrosense-reporting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pyrosense_reporting
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/pyrosense}
          jwk-set-uri: ${KEYCLOAK_JWK_SET:http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs}

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

pyrosense:
  reporting:
    kafka:
      output-topic: reporting-events
