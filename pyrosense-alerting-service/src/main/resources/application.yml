spring:
  application:
    name: pyrosense-alerting-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5432/pyrosense_alerting
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: alerting-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/pyrosense}
          jwk-set-uri: ${KEYCLOAK_JWK_SET:http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs}

server:
  port: 8086
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

pyrosense:
  alerting:
    escalation-check-interval: 300000
    sla:
      critical-deadline: 24h
      warning-deadline: 7d
      info-deadline: 30d
      escalation-interval: 4h
    kafka:
      scoring-topic: ${KAFKA_TOPIC_SCORING:pyrosense.scoring.events}
      analysis-topic: ${KAFKA_TOPIC_ANALYSIS:pyrosense.analysis.events}
      output-topic: ${KAFKA_TOPIC_ALERTS:pyrosense.alerts.events}
      dlq-topic: ${KAFKA_TOPIC_DLQ:pyrosense.dead-letter.events}
      retry:
        max-attempts: 3
        backoff-ms: 1000
        backoff-multiplier: 2
