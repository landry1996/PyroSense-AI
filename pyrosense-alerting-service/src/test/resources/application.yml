spring:
  datasource:
    url: jdbc:h2:mem:alerting_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/test
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alerting-test
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
          jwk-set-uri: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs

pyrosense:
  alerting:
    escalation-check-interval: 300000
    sla:
      critical-deadline: 24h
      warning-deadline: 7d
      info-deadline: 30d
      escalation-interval: 4h
    kafka:
      scoring-topic: scoring-events
      analysis-topic: analysis-events
      output-topic: alerting-events
