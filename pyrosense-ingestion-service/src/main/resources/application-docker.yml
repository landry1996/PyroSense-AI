spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pyrosense_ingestion}
    username: ${DB_USERNAME:pyrosense}
    password: ${DB_PASSWORD:pyrosense_local_dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

pyrosense:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
    enabled: true
  device-service:
    url: ${DEVICE_SERVICE_URL:http://device-service:8082}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml
