spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
          jwk-set-uri: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs

pyrosense:
  mqtt:
    broker-url: tcp://localhost:1883
    enabled: false
  device-service:
    url: http://localhost:8082

logging:
  level:
    com.pyrosense.ingestion: DEBUG
