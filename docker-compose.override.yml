# ============================================================
# PyroSense - Docker Compose Override (Development Enhancements)
# ============================================================
# This file is automatically loaded by docker compose.
# It adds development-friendly settings on top of docker-compose.yml.
#
# To skip: docker compose -f docker-compose.yml up
# ============================================================

services:

  # Expose Kafka externally for local IDE debugging
  kafka:
    ports:
      - "9092:29092"

  # Add debug ports for services (JDWP remote debugging)
  identity-service:
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m -XX:+UseZGC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8081:8081"
      - "5011:5005"
    profiles: ["services", "full"]

  device-service:
