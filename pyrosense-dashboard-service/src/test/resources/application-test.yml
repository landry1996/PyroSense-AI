spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pyrosense
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

pyrosense:
  dashboard:
    cache:
      overview-ttl: 5s
      risky-buildings-ttl: 5s
      risk-trend-ttl: 5s
      device-health-ttl: 5s
