# ============================================================
# PyroSense AI Platform - Secret Configuration Template
# ============================================================
# INSTRUCTIONS:
# 1. Copy this file to application-secret.yml
# 2. Fill in actual values (NEVER commit application-secret.yml)
# 3. application-secret.yml is in .gitignore
# 4. For production, use environment variables or HashiCorp Vault
# ============================================================

# --- Database ---
DB_USERNAME: pyrosense
DB_PASSWORD: CHANGE_ME_STRONG_PASSWORD

# --- Keycloak / OAuth2 ---
KEYCLOAK_ISSUER: http://localhost:8180/realms/pyrosense
KEYCLOAK_JWK_URI: http://localhost:8180/realms/pyrosense/protocol/openid-connect/certs
KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME

# --- Kafka ---
KAFKA_SERVERS: localhost:9092
# For production with SASL:
# KAFKA_SASL_USERNAME: pyrosense-producer
# KAFKA_SASL_PASSWORD: CHANGE_ME
# KAFKA_SECURITY_PROTOCOL: SASL_SSL

# --- Redis ---
REDIS_HOST: localhost
REDIS_PORT: 6379
# REDIS_PASSWORD: CHANGE_ME

# --- MQTT Broker ---
MQTT_BROKER_URL: tcp://localhost:1883
# For production with TLS:
# MQTT_BROKER_URL: ssl://mqtt.pyrosense.example.com:8883
# MQTT_CLIENT_CERT_PATH: /etc/pyrosense/certs/mqtt-client.pem
# MQTT_CLIENT_KEY_PATH: /etc/pyrosense/certs/mqtt-client.key

# --- CORS ---
CORS_ORIGINS: http://localhost:3000

# --- Notification Channels (for notification-service) ---
# SMTP_HOST: smtp.example.com
# SMTP_PORT: 587
# SMTP_USERNAME: alerts@pyrosense.example.com
# SMTP_PASSWORD: CHANGE_ME
# TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# TWILIO_AUTH_TOKEN: CHANGE_ME
# TWILIO_FROM_NUMBER: +1234567890

# --- External Integrations ---
# INSURANCE_API_KEY: CHANGE_ME
# INSURANCE_API_URL: https://api.partner.example.com/v1

# ============================================================
# VAULT INTEGRATION (Production)
# ============================================================
# When migrating to HashiCorp Vault:
# 1. Install spring-cloud-vault dependency
# 2. Add to bootstrap.yml:
#    spring.cloud.vault:
#      uri: https://vault.pyrosense.internal
#      authentication: KUBERNETES
#      kubernetes:
#        role: pyrosense-service
#      kv:
#        backend: secret
#        default-context: pyrosense
# 3. Vault paths:
#    secret/pyrosense/database -> DB_USERNAME, DB_PASSWORD
#    secret/pyrosense/keycloak -> KEYCLOAK_ADMIN_PASSWORD
#    secret/pyrosense/kafka    -> KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD
#    secret/pyrosense/mqtt     -> client certificates
#    secret/pyrosense/smtp     -> SMTP credentials
# ============================================================
