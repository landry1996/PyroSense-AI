groups:
  - name: pyrosense-platform-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage on {{ $labels.job }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }}."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "More than 10% of requests are failing with 5xx errors."

      - alert: NoSignalsIngested
        expr: rate(pyrosense_signals_ingested_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No signals ingested in 10 minutes"
          description: "The ingestion service has not received any signals for 10 minutes."

      - alert: HighRiskScore
        expr: pyrosense_risk_score_current > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical risk score detected"
          description: "Installation {{ $labels.installation_id }} has a risk score of {{ $value }}."
