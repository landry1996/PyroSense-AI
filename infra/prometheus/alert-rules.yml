groups:
  - name: pyrosense-service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage on {{ $labels.job }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }}."

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application) / sum(rate(http_server_requests_seconds_count[5m])) by (application) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.application }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)."

      - alert: HighResponseLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.application }}"
          description: "P95 response time is {{ $value }}s."

  - name: pyrosense-ingestion
    rules:
      - alert: IngestionDown
        expr: rate(pyrosense_telemetry_received_total[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No telemetry ingested for 10 minutes"
          description: "The ingestion service has not received any telemetry for 10 minutes."

      - alert: HighRejectionRate
        expr: rate(pyrosense_telemetry_rejected_total[5m]) / rate(pyrosense_telemetry_received_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High telemetry rejection rate"
          description: "Rejection rate is {{ $value | humanizePercentage }}."

  - name: pyrosense-kafka
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumer_fetch_manager_records_lag) by (application, topic) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "{{ $labels.application }} has {{ $value }} messages lag on topic {{ $labels.topic }}."

      - alert: KafkaConsumerLagCritical
        expr: sum(kafka_consumer_fetch_manager_records_lag) by (application, topic) > 10000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical Kafka consumer lag"
          description: "{{ $labels.application }} has {{ $value }} messages lag on topic {{ $labels.topic }}."

  - name: pyrosense-devices
    rules:
      - alert: DevicesOfflineHigh
        expr: pyrosense_devices_offline_total > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many devices offline"
          description: "{{ $value }} devices are currently offline."

      - alert: DeviceOfflineCritical
        expr: pyrosense_devices_offline_total > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical number of devices offline"
          description: "{{ $value }} devices are offline - possible infrastructure issue."

  - name: pyrosense-risk-alerting
    rules:
      - alert: HighRiskScore
        expr: pyrosense_risk_score_current > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical risk score detected"
          description: "Device {{ $labels.device_id }} has a risk score of {{ $value }}."

      - alert: CriticalAlertsActive
        expr: pyrosense_alerts_critical_active > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Many critical alerts active"
          description: "{{ $value }} critical alerts are currently active."

  - name: pyrosense-notifications
    rules:
      - alert: NotificationFailureRateHigh
        expr: rate(pyrosense_notifications_failed_total[5m]) / (rate(pyrosense_notifications_sent_total[5m]) + rate(pyrosense_notifications_failed_total[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High notification failure rate"
          description: "Notification failure rate is {{ $value | humanizePercentage }}."

      - alert: NotificationsBacklog
        expr: pyrosense_notifications_retrying > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Notification retry backlog growing"
          description: "{{ $value }} notifications are in retry state."

  - name: pyrosense-mvp2
    rules:
      - alert: NotificationFailuresHigh
        expr: rate(pyrosense_notification_failed_total[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High notification failure rate (MVP 2)"
          description: "Notification failures: {{ $value | humanize }}/s over last 5 minutes."

      - alert: ReportGenerationFailures
        expr: increase(pyrosense_reporting_reports_failed_total[15m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Report generation failures detected"
          description: "{{ $value }} report generation failures in the last 15 minutes."

      - alert: KafkaDlqNonEmpty
        expr: sum(increase(pyrosense_maintenance_dlq_events_total[5m]) + increase(pyrosense_notification_dlq_events_total[5m]) + increase(pyrosense_reporting_dlq_events_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Events routed to DLQ"
          description: "Dead letter queue received events - investigate processing failures."

      - alert: InterventionOverdueHigh
        expr: pyrosense_maintenance_interventions_overdue > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many interventions overdue"
          description: "{{ $value }} interventions are past their SLA deadline."

      - alert: ApiErrorRateHigh
        expr: sum(rate(http_server_requests_seconds_count{status=~"5..", application=~"pyrosense-(dashboard|maintenance|reporting|notification)-service"}[5m])) by (application) / sum(rate(http_server_requests_seconds_count{application=~"pyrosense-(dashboard|maintenance|reporting|notification)-service"}[5m])) by (application) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate on {{ $labels.application }}"
          description: "5xx error rate is {{ $value | humanizePercentage }} on {{ $labels.application }}."

      - alert: ReportDownloadDeniedSpike
        expr: increase(pyrosense_reporting_downloads_denied_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Spike in denied report downloads"
          description: "{{ $value }} report download attempts denied in 5 minutes - possible token abuse."

      - alert: SuspiciousTenantAccessDetected
        expr: sum(increase(pyrosense_dashboard_suspicious_tenant_access_total[5m]) + increase(pyrosense_maintenance_suspicious_tenant_access_total[5m]) + increase(pyrosense_notification_suspicious_tenant_access_total[5m])) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Suspicious cross-tenant access detected"
          description: "Multiple cross-tenant access attempts detected across MVP 2 services."

  - name: pyrosense-mvp3
    rules:
      - alert: Mvp3SignatureInvalidSpike
        expr: rate(pyrosense_mvp3_signature_invalid_total[5m]) > 0.5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High rate of invalid device signatures"
          description: "{{ $value | humanize }}/s invalid HMAC signatures detected — possible device compromise or key mismatch."

      - alert: Mvp3ReplayAttackDetected
        expr: increase(pyrosense_mvp3_replay_detected_total[5m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replay attacks detected on real devices"
          description: "{{ $value }} replay attempts blocked in last 5 minutes."

      - alert: Mvp3DeviceOfflineLong
        expr: pyrosense_mvp3_device_offline_duration_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Device offline for over 1 hour"
          description: "A real device has been offline for {{ $value | humanizeDuration }}."

      - alert: Mvp3LowSignalQualityHigh
        expr: rate(pyrosense_mvp3_low_signal_quality_total[10m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent low signal quality events"
          description: "{{ $value | humanize }}/s low signal quality events — check device placement or interference."

      - alert: Mvp3ClockDriftFrequent
        expr: rate(pyrosense_mvp3_clock_drift_total[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent clock drift events on real devices"
          description: "{{ $value | humanize }}/s clock drift events — NTP sync may be failing."

      - alert: Mvp3NoRealDeviceData
        expr: rate(pyrosense_mvp3_real_device_telemetry_received_total[10m]) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No telemetry from real devices for 15 minutes"
          description: "No real device (MVP3) telemetry received — check MQTT broker and device connectivity."

      - alert: Mvp3ValidationLatencyHigh
        expr: histogram_quantile(0.95, rate(pyrosense_mvp3_validation_duration_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High validation pipeline latency"
          description: "P95 validation duration is {{ $value }}s — investigate signature verification or replay check bottleneck."

      - alert: Mvp3DataQualityLow
        expr: pyrosense_mvp3_data_quality_score < 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low data quality score"
          description: "Data quality score is {{ $value }} — below acceptable threshold (60)."

      - alert: Mvp3PilotDevicesInactive
        expr: pyrosense_mvp3_pilot_active_devices < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Too few active devices in pilot"
          description: "Only {{ $value }} devices active in pilot program — expected minimum is 5."

      - alert: Mvp3FirmwareVersionDrift
        expr: pyrosense_mvp3_firmware_version_count > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Too many firmware versions in fleet"
          description: "{{ $value }} distinct firmware versions detected — schedule firmware update campaign."
