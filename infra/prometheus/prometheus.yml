global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  # When services run in Docker (profile: services/full), use container names.
  # When services run on host (IDE), use host.docker.internal:PORT instead.

  - job_name: 'pyrosense-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080', 'host.docker.internal:8080']

  - job_name: 'pyrosense-identity'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity-service:8081', 'host.docker.internal:8081']

  - job_name: 'pyrosense-device'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['device-service:8082', 'host.docker.internal:8082']

  - job_name: 'pyrosense-ingestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ingestion-service:8083', 'host.docker.internal:8083']

  - job_name: 'pyrosense-analysis'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['analysis-service:8084', 'host.docker.internal:8084']

  - job_name: 'pyrosense-scoring'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['scoring-service:8085', 'host.docker.internal:8085']

  - job_name: 'pyrosense-alerting'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['alerting-service:8086', 'host.docker.internal:8086']

  - job_name: 'pyrosense-notification'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8087', 'host.docker.internal:8087']

  - job_name: 'pyrosense-reporting'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['reporting-service:8091', 'host.docker.internal:8091']

  - job_name: 'pyrosense-maintenance'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['maintenance-service:8089', 'host.docker.internal:8089']
